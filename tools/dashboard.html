<!DOCTYPE html>

<meta charset="UTF-8" />
<!-- Screenshot harness for the dashboard. Loads the real stylesheet and the
     real renderer, then feeds it one representative snapshot, so the images in
     docs/media are the actual UI rather than a mock-up.

       ?empty   the not-yet-connected state
       ?waiting connected feed with no quality signals
       ?context latest-prompt gauge instead of local budget
       ?account synthetic combined account usage and plan allowance
       ?credits scroll to the retained-trace credit breakdown
       ?narrow  sidebar width (the CSS breakpoint does the rest)
-->
<link href="../media/dashboard.css" rel="stylesheet" />
<title>dashboard shot</title>
<style>
  /* The webview inherits these from VS Code; supply them so the shot matches. */
  :root {
    --vscode-font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --vscode-editor-font-family: 'Cascadia Mono', Consolas, ui-monospace, monospace;
    --vscode-button-background: #1f6feb;
    --vscode-button-foreground: #ffffff;
    --vscode-button-secondaryBackground: #21262d;
    --vscode-button-secondaryForeground: #c9d1d9;
  }
</style>
</head>
<body>
  <div id="banner"></div>

<script>
  window.acquireVsCodeApi = function () {
    return { postMessage: function () {} };

</script>
<script>
  const theme = new URLSearchParams(location.search).get('theme') || 'dark';
  const themes = {
    dark: { background: '#1f1f1f', foreground: '#cccccc', muted: '#a0a0a0', surface: '#252526', border: '#454545', blue: '#3794ff', green: '#89d185', yellow: '#d7ba7d' },
    light: { background: '#ffffff', foreground: '#333333', muted: '#616161', surface: '#f3f3f3', border: '#c8c8c8', blue: '#006ab1', green: '#1a7f37', yellow: '#795e00' },
    'high-contrast': { background: '#000000', foreground: '#ffffff', muted: '#ffffff', surface: '#000000', border: '#ffffff', blue: '#ffffff', green: '#ffffff', yellow: '#ffffff' },
    'high-contrast-light': { background: '#ffffff', foreground: '#000000', muted: '#000000', surface: '#ffffff', border: '#000000', blue: '#000000', green: '#000000', yellow: '#000000' }
  };
  if (!themes[theme]) throw new Error('Unknown dashboard theme: ' + theme);
  window.setDashboardTheme = function (name) {
    const selected = themes[name];
    if (!selected) throw new Error('Unknown dashboard theme: ' + name);
    document.body.className = 'vscode-' + name;
    const values = {
      'editor-background': selected.background, 'editor-foreground': selected.foreground,
      'descriptionForeground': selected.muted, 'sideBar-background': selected.surface,
      'panel-border': selected.border, 'charts-blue': selected.blue, 'charts-green': selected.green,
      'charts-yellow': selected.yellow, 'errorForeground': selected.foreground
    };
    if (name.includes('high-contrast')) values.contrastBorder = selected.border;
    else document.body.style.removeProperty('--vscode-contrastBorder');
    for (const [key, value] of Object.entries(values)) document.body.style.setProperty('--vscode-' + key, value);
  };
  window.setDashboardTheme(theme);
</script>
<script src="../media/dashboard.js"></script>

</script>
