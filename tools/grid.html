<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Iceberg — melt progression</title>
<style>
  html, body { margin: 0; height: 100%; background: #101317; }
  #wrap { display: flex; gap: 14px; padding: 14px; box-sizing: border-box; height: 100%; }
  .cell { flex: 1 1 0; display: flex; flex-direction: column; min-width: 0; }
  .cap {
    font: 700 12px/1.5 "Segoe UI", system-ui, sans-serif;
    letter-spacing: .6px;
    color: #cfd6dd;
    padding: 0 0 7px 1px;
    display: flex;
    justify-content: space-between;
  }
  .cap .n { color: #7d8894; font-weight: 600; }
  .box { flex: 1 1 auto; border: 1px solid #2b3138; min-height: 0; }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
  <div id="wrap">
    <div class="cell">
      <div class="cap"><span style="color:#9fd8ff">100% ice</span><span class="n">0 tokens</span></div>
      <div class="box"><iframe src="shot.html?health=1&amp;chrome=0"></iframe></div>
    </div>
    <div class="cell">
      <div class="cap"><span style="color:#9fd8ff">60% ice</span><span class="n">2.0M tokens</span></div>
      <div class="box"><iframe src="shot.html?health=0.6&amp;chrome=0"></iframe></div>
    </div>
    <div class="cell">
      <div class="cap"><span style="color:#ffcf7a">28% ice</span><span class="n">3.6M tokens</span></div>
      <div class="box"><iframe src="shot.html?health=0.28&amp;chrome=0"></iframe></div>
    </div>
    <div class="cell">
      <div class="cap"><span style="color:#ff8a6b">0% ice</span><span class="n">5.0M tokens</span></div>
      <div class="box"><iframe src="shot.html?health=0&amp;chrome=0"></iframe></div>
    </div>
  </div>
</body>
</html>
