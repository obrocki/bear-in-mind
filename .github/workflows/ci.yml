name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A code fence opened with ```` and closed with ``` swallows the rest of
      # the file when GitHub renders it, and looks fine in most editors.
      - name: Check the docs
        if: matrix.os == 'ubuntu-latest'
        run: npm run check:docs

      # The telemetry parsing is the easiest place here to be quietly wrong —
      # cumulative metrics summed instead of taken, a counter reset losing
      # history — so it runs on every platform rather than just Linux.
      - name: Run the tests
        run: npm test

      # One command — the same one contributors run locally. It typechecks,
      # bundles, packages, then reopens the .vsix and checks what actually
      # shipped, so a bad .vscodeignore fails here rather than on a user's
      # machine.
      - name: Build and verify the VSIX
        id: build
        shell: bash
        env:
          SUMMARY: ${{ matrix.os == 'ubuntu-latest' && '--github' || '' }}
        run: node tools/build-vsix.js --out-dir build --label "${GITHUB_SHA::7}" $SUMMARY

      # Merged code is packaged by build-vsix.yml, so only pull requests need an
      # artifact here — it lets a reviewer install the branch and try it.
      - name: Upload the VSIX for review
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.vsix_name }}
          path: build/*.vsix
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release merged version
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    secrets: inherit
