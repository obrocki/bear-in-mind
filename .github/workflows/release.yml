name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  release:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: stable-release
      cancel-in-progress: false
    env:
      # Read here rather than on the step, because the `secrets` context is not
      # available to a step's own `if:` — only `env` is.
      VSCE_PAT: ${{ secrets.VSCE_PAT }}

    steps:
      - uses: actions/checkout@v7

      - name: Plan an unpublished version
        id: release
        uses: actions/github-script@v8
        with:
          script: |
            const { version } = require(`${process.env.GITHUB_WORKSPACE}/package.json`);
            if (!/^\d+\.\d+\.\d+$/.test(version)) {
              throw new Error(`Expected a stable major.minor.patch version, got ${version}`);
            }
            const tag = `v${version}`;
            const commit = require('node:child_process').execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
            if (context.ref.startsWith('refs/tags/') && context.ref !== `refs/tags/${tag}`) {
              throw new Error(`Tag ${context.ref} does not match package.json ${tag}`);
            }
            const repo = context.repo;
            try {
              const { data } = await github.rest.repos.getReleaseByTag({ ...repo, tag });
              if (!data.draft) {
                core.notice(`${tag} is already released; no duplicate publication.`);
                core.setOutput('publish', 'false');
                return;
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            let existingRef;
            try {
              const { data } = await github.rest.git.getRef({ ...repo, ref: `tags/${tag}` });
              existingRef = data.object;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            while (existingRef?.type === 'tag') {
              const { data } = await github.rest.git.getTag({ ...repo, tag_sha: existingRef.sha });
              existingRef = data.object;
            }
            if (existingRef && (existingRef.type !== 'commit' || existingRef.sha !== commit)) {
              throw new Error(`${tag} already points to ${existingRef.sha}, not the tested commit ${commit}`);
            }
            core.setOutput('tag', tag);
            core.setOutput('commit', commit);
            core.setOutput('publish', 'true');

      - uses: actions/setup-node@v7
        if: steps.release.outputs.publish == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.release.outputs.publish == 'true'

      - name: Verify release behavior
        if: steps.release.outputs.publish == 'true'
        run: npm test && npm run check:docs

      - name: Build and verify the VSIX
        if: steps.release.outputs.publish == 'true'
        id: build
        run: node tools/build-vsix.js --out-dir build --github

      - name: Attach the VSIX to the GitHub release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ steps.release.outputs.commit }}
          files: build/*.vsix
          fail_on_unmatched_files: true
          generate_release_notes: true

      # Publishing to the Marketplace is opt-in: it only runs once VSCE_PAT is
      # configured as a repository secret.
      - name: Publish to the VS Code Marketplace
        if: steps.release.outputs.publish == 'true' && env.VSCE_PAT != ''
        run: npx vsce publish --no-dependencies --packagePath "${{ steps.build.outputs.vsix_path }}"
