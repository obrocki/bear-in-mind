name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Read here rather than on the step, because the `secrets` context is not
      # available to a step's own `if:` — only `env` is.
      VSCE_PAT: ${{ secrets.VSCE_PAT }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build and verify the VSIX
        id: build
        run: node tools/build-vsix.js --out-dir build --github

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          BUILT_VERSION: ${{ steps.build.outputs.version }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$BUILT_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $BUILT_VERSION"
            exit 1
          fi

      - name: Attach the VSIX to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.vsix
          generate_release_notes: true

      # Publishing to the Marketplace is opt-in: it only runs once VSCE_PAT is
      # configured as a repository secret.
      - name: Publish to the VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx vsce publish --no-dependencies --packagePath "${{ steps.build.outputs.vsix_path }}"
