<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI attribution</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="top">
      <div class="heading">
        <h1 id="title">AI attribution</h1>
        <p class="question">What AI was used for, what it cost and what is still unknown.</p>
      </div>
      <label class="theme-control">Theme
        <select id="theme" aria-label="Color theme">
          <option value="auto">App / system</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </label>
      <nav class="tabs" id="tabs" role="tablist" aria-label="Views"></nav>
    </header>
    <main id="view" role="tabpanel" tabindex="-1" aria-live="polite">
      <p class="muted">Loading…</p>
    </main>
    <footer class="experimental-note" role="note" aria-label="Experimental use">
      <strong>Experimental research tool.</strong>
      Results may be incomplete or inaccurate. Do not use them alone for billing,
      savings claims or individual performance decisions.
    </footer>
    <script type="module" src="/app.js"></script>
  </body>
</html>
